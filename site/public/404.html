<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stránka sa nenašla – BetterUis</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/icon128.png">
  <link rel="stylesheet" href="/style.css">
  <script>
    try {
      const t = localStorage.getItem('bu-theme');
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (_) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
</head>
<body>
  <main class="doc">
    <div class="wrap narrow">
      <h1>404</h1>
      <p>Táto stránka neexistuje. / This page doesn't exist.</p>
      <p><a class="text-link" href="/">← BetterUis</a></p>
    </div>
  </main>
</body>
</html>
