  <script>
    // theme before first paint: saved pick, else the system setting
    try {
      const t = localStorage.getItem('bu-theme');
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (_) {
      document.documentElement.dataset.theme = 'light';
    }
    try {
      if (localStorage.getItem('bu-motion') === 'off') document.documentElement.classList.add('still');
    } catch (_) {
      // storage blocked: animations stay on
    }
  </script>
