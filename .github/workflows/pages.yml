# Builds the React site in site/ (Vite) and publishes site/dist to GitHub
# Pages (betteruis.greenybeany.dev, see site/public/CNAME) on every push to
# main that touches it. Build and deploy are separate jobs, as in GitHub's
# own template - deploying in the same job as the upload sometimes failed
# with "No artifacts named github-pages were found".
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'manifest.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
